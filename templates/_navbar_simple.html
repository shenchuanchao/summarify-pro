<!-- ══════════════════════ NAVBAR (simple — no auth buttons) ══════════════════════ -->
<nav id="navbar" class="fixed top-0 inset-x-0 z-50 bg-white/80 backdrop-blur-xl border-b border-gray-200/60 transition-shadow">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
{% set active = nav_active|default('') %}
        <div class="flex items-center justify-between h-16">
            <!-- Left: Logo -->
            <a href="/" class="flex items-center gap-2.5 font-bold text-xl text-brand-700 shrink-0">
                <svg class="w-8 h-8" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="url(#g)"/><path d="M8 16h4l3-8 4 16 3-8h4" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="g" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient></defs></svg>
                <span class="text-sm sm:text-xl">Summarify <span class="text-brand-600">Pro</span></span>
            </a>

            <!-- Center: Nav Links (desktop only) -->
            <div class="hidden sm:flex items-center gap-1">
                <a href="/" class="px-3 py-2 rounded-lg text-sm font-medium transition-colors {% if active == 'summarize' %}text-brand-700 bg-brand-50{% else %}text-gray-600 hover:text-brand-700 hover:bg-brand-50{% endif %}">Summarize</a>
                <a href="/youtube-summarizer" class="px-3 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-1.5 {% if active == 'youtube' %}text-red-600 bg-red-50{% else %}text-gray-600 hover:text-red-600 hover:bg-red-50{% endif %}">YouTube</a>
                <a href="/blog/" class="px-3 py-2 rounded-lg text-sm font-medium transition-colors {% if active == 'blog' %}text-brand-700 bg-brand-50{% else %}text-gray-600 hover:text-brand-700 hover:bg-brand-50{% endif %}">Blog</a>
            </div>

            <!-- Right: Language switcher -->
            <div class="flex items-center gap-2 sm:gap-3 shrink-0">
                <!-- Language Switcher Dropdown -->
                <div class="relative">
                    <select onchange="if(this.value)window.location.href=this.value" class="appearance-none bg-white border border-gray-200 rounded-lg pl-8 pr-7 py-1.5 text-xs font-medium text-gray-700 cursor-pointer hover:border-brand-300 focus:outline-none focus:ring-2 focus:ring-brand-500/20 transition-colors">
                        <option value="" selected>English</option>
                        <option value="/zh/">中文</option>
                    </select>
                    <svg class="absolute left-2 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-gray-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z" stroke-width="2"/></svg>
                    <svg class="absolute right-1.5 top-1/2 -translate-y-1/2 w-3 h-3 text-gray-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                </div>
                <!-- Mobile Hamburger -->
                <button id="mobile-menu-btn" onclick="toggleMobileMenu()" class="sm:hidden p-2 rounded-lg hover:bg-gray-100 transition-colors" aria-label="Toggle menu">
                    <svg id="hamburger-icon" class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                    <svg id="close-icon" class="hidden w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
        </div>

        <!-- Mobile Menu Dropdown -->
        <div id="mobile-menu" class="hidden sm:hidden pb-4 space-y-1 animate-fade-in">
            <a href="/" class="block px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {% if active == 'summarize' %}text-brand-700 bg-brand-50 font-semibold{% else %}text-gray-700 hover:text-brand-700 hover:bg-brand-50{% endif %}">📄 Summarize</a>
            <a href="/youtube-summarizer" class="block px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {% if active == 'youtube' %}text-red-600 bg-red-50 font-semibold{% else %}text-gray-700 hover:text-red-600 hover:bg-red-50{% endif %}">📺 YouTube Summarizer</a>
            <a href="/blog/" class="block px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {% if active == 'blog' %}text-brand-700 bg-brand-50 font-semibold{% else %}text-gray-700 hover:text-brand-700 hover:bg-brand-50{% endif %}">📝 Blog</a>
        </div>
    </div>
</nav>

<script>
function toggleMobileMenu() {
    const menu = document.getElementById('mobile-menu');
    const hamburger = document.getElementById('hamburger-icon');
    const close = document.getElementById('close-icon');
    const isOpen = !menu.classList.contains('hidden');
    if (isOpen) {
        closeMobileMenu();
    } else {
        menu.classList.remove('hidden');
        hamburger.classList.add('hidden');
        close.classList.remove('hidden');
    }
}
function closeMobileMenu() {
    document.getElementById('mobile-menu').classList.add('hidden');
    document.getElementById('hamburger-icon').classList.remove('hidden');
    document.getElementById('close-icon').classList.add('hidden');
}
window.addEventListener('resize', () => {
    if (window.innerWidth >= 640) closeMobileMenu();
});
</script>
