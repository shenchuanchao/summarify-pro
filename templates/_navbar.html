<!-- ══════════════════════ NAVBAR ══════════════════════ -->
<nav id="navbar" class="fixed top-0 inset-x-0 z-50 bg-white/80 backdrop-blur-xl border-b border-gray-200/60 transition-shadow">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
{% set active = nav_active|default('') %}
        <div class="flex items-center justify-between h-16">
            <!-- Left: Logo -->
            <a href="/" class="flex items-center gap-2.5 font-bold text-xl text-brand-700 shrink-0">
                <svg class="w-8 h-8" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="url(#g)"/><path d="M8 16h4l3-8 4 16 3-8h4" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="g" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient></defs></svg>
                <span class="text-sm sm:text-xl">Summarify <span class="text-brand-600">Pro</span></span>
            </a>

            <!-- Center: Nav Links (desktop only) -->
            <div class="hidden sm:flex items-center gap-1">
                <a href="/" class="nav-link px-3 py-2 rounded-lg text-sm font-medium transition-colors {% if active == 'summarize' %}text-brand-700 bg-brand-50{% else %}text-gray-600 hover:text-brand-700 hover:bg-brand-50{% endif %}">Summarize</a>
                <a href="/youtube-summarizer" class="nav-link px-3 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-1.5 {% if active == 'youtube' %}text-red-600 bg-red-50{% else %}text-gray-600 hover:text-red-600 hover:bg-red-50{% endif %}">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
                    YouTube
                </a>
            </div>

            <!-- Right: Auth / User -->
            <div class="flex items-center gap-3 shrink-0">
                <!-- Auth Buttons (not logged in) -->
                <div id="nav-auth" class="flex items-center gap-3">
                    <button onclick="showModal('login')" class="hidden sm:block text-sm font-medium text-gray-600 hover:text-brand-600 transition-colors px-2 sm:px-3 py-2">Log in</button>
                    <button onclick="showModal('register')" class="text-sm font-semibold bg-brand-600 text-white px-3 sm:px-4 py-2 rounded-lg hover:bg-brand-700 transition-colors shadow-sm">Sign up</button>
                </div>
                <!-- User Info (logged in) -->
                <div id="nav-user" class="hidden items-center gap-3 sm:gap-4">
                    <span id="plan-badge" class="hidden text-xs font-medium bg-amber-50 text-amber-700 px-2 sm:px-3 py-1 rounded-full border border-amber-200">⭐ Premium</span>
                    <span id="usage-badge" class="hidden text-xs font-medium bg-brand-50 text-brand-700 px-2 sm:px-3 py-1 rounded-full border border-brand-200 truncate"></span>
                    <span id="user-email" class="hidden sm:inline text-sm text-gray-600 font-medium max-w-[140px] truncate"></span>
                    <button onclick="logout()" class="hidden sm:inline-flex text-sm text-gray-500 hover:text-red-500 transition-colors py-2">Sign out</button>
                </div>

                <!-- Mobile Hamburger -->
                <button id="mobile-menu-btn" onclick="toggleMobileMenu()" class="sm:hidden p-2 rounded-lg hover:bg-gray-100 transition-colors" aria-label="Toggle menu">
                    <svg id="hamburger-icon" class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                    <svg id="close-icon" class="hidden w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
        </div>

        <!-- Mobile Menu Dropdown -->
        <div id="mobile-menu" class="hidden sm:hidden pb-4 space-y-1 animate-fade-in">
            <a href="/" class="block px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {% if active == 'summarize' %}text-brand-700 bg-brand-50 font-semibold{% else %}text-gray-700 hover:text-brand-700 hover:bg-brand-50{% endif %}">📄 Summarize</a>
            <a href="/youtube-summarizer" class="block px-3 py-2.5 rounded-lg text-sm font-medium transition-colors {% if active == 'youtube' %}text-red-600 bg-red-50 font-semibold{% else %}text-gray-700 hover:text-red-600 hover:bg-red-50{% endif %}">📺 YouTube Summarizer</a>
            <!-- Mobile Menu User (logged in only) -->
            <div id="mobile-menu-user" class="hidden pt-2 mt-2 border-t border-gray-100">
                <div class="flex items-center justify-between px-3 py-2.5">
                    <span id="mobile-user-email" class="text-sm text-gray-500 truncate max-w-[180px]"></span>
                    <button onclick="closeMobileMenu(); logout()" class="text-sm text-red-500 hover:text-red-600 font-medium shrink-0 ml-2">Sign out</button>
                </div>
            </div>
        </div>
    </div>
</nav>

<script>
function toggleMobileMenu() {
    const menu = document.getElementById('mobile-menu');
    const hamburger = document.getElementById('hamburger-icon');
    const close = document.getElementById('close-icon');
    const isOpen = !menu.classList.contains('hidden');
    if (isOpen) {
        closeMobileMenu();
    } else {
        menu.classList.remove('hidden');
        hamburger.classList.add('hidden');
        close.classList.remove('hidden');
    }
}
function closeMobileMenu() {
    document.getElementById('mobile-menu').classList.add('hidden');
    document.getElementById('hamburger-icon').classList.remove('hidden');
    document.getElementById('close-icon').classList.add('hidden');
}
// Close mobile menu on resize to desktop
window.addEventListener('resize', () => {
    if (window.innerWidth >= 640) closeMobileMenu();
});
</script>
