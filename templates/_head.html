<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ description }}">
    <title>{{ title }}</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    {% if canonical %}<link rel="canonical" href="{{ canonical }}">{% endif %}

    <!-- Open Graph -->
    <meta property="og:title" content="{{ title }}">
    <meta property="og:description" content="{{ description }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ canonical or 'https://www.summarifypro.com/' }}">
    <meta property="og:site_name" content="Summarify Pro">
    <meta property="og:image" content="https://www.summarifypro.com/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/png">
    <meta property="og:locale" content="en_US">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ title }}">
    <meta name="twitter:description" content="{{ description }}">
    <meta name="twitter:image" content="https://www.summarifypro.com/og-image.png">

    <!-- Hreflang -->
    {% if hreflang_zh %}<link rel="alternate" hreflang="zh-CN" href="{{ hreflang_zh }}">{% endif %}
    {% if hreflang_en %}<link rel="alternate" hreflang="en" href="{{ hreflang_en }}">{% endif %}
    <link rel="alternate" hreflang="x-default" href="{{ canonical or 'https://www.summarifypro.com/' }}">

    <!-- Preload critical assets -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="/style.css" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd',
                            400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8',
                            800: '#1e40af', 900: '#1e3a8a', 950: '#172554'
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.6s ease-out',
                        'pulse-slow': 'pulse 3s infinite',
                        'float': 'float 3s ease-in-out infinite'
                    }
                }
            }
        }
    </script>
    <!-- Prevent FOUC: hide auth buttons if already logged in -->
    <script>if(localStorage.getItem('summarify_token'))document.documentElement.dataset.loggedIn='true'</script>
    <style>[data-logged-in="true"] #nav-auth{display:none!important}[data-logged-in="true"] #nav-user{display:flex!important}</style>
    <meta name="google-site-verification" content="uPEilnZedniwgO16iL68R_U_5YXL-3G-qFThUqUhEQI" />
    <meta name="google-adsense-account" content="ca-pub-7920881140897917">
</head>
