<!-- 登录弹窗 -->
<div id="modal-login" class="modal hidden fixed inset-0 z-[100] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="hideModal('login')"></div>
    <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-sm p-8 animate-slide-up">
        <button onclick="hideModal('login')" class="absolute top-4 right-4 text-gray-300 hover:text-gray-600 transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
        <h2 class="text-xl font-bold text-gray-900 mb-1">欢迎回来</h2>
        <p class="text-sm text-gray-500 mb-3">登录您的账号</p>
        <div id="modal-login-msg" class="hidden text-sm text-amber-700 bg-amber-50 p-3 rounded-lg mb-3"></div>
        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div><label class="block text-xs font-semibold text-gray-600 mb-1">邮箱</label><input id="login-email" type="email" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 outline-none" placeholder="you@example.com"></div>
            <div><label class="block text-xs font-semibold text-gray-600 mb-1">密码</label><input id="login-password" type="password" required minlength="6" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 outline-none" placeholder="······"></div>
            <button type="submit" class="w-full bg-brand-600 text-white py-3 rounded-xl font-semibold text-sm hover:bg-brand-700 transition-colors">登录</button>
        </form>
        <p class="mt-4 text-center text-sm text-gray-500">还没有账号？ <button onclick="switchModal('register')" class="text-brand-600 font-semibold hover:underline">免费注册</button></p>
    </div>
</div>

<!-- 注册弹窗 -->
<div id="modal-register" class="modal hidden fixed inset-0 z-[100] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="hideModal('register')"></div>
    <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-sm p-8 animate-slide-up">
        <button onclick="hideModal('register')" class="absolute top-4 right-4 text-gray-300 hover:text-gray-600 transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
        <h2 class="text-xl font-bold text-gray-900 mb-1">创建账号</h2>
        <p class="text-sm text-gray-500 mb-6">注册后即可无限使用</p>
        <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4">
            <div><label class="block text-xs font-semibold text-gray-600 mb-1">邮箱</label><input id="register-email" type="email" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 outline-none" placeholder="you@example.com"></div>
            <div><label class="block text-xs font-semibold text-gray-600 mb-1">密码</label><input id="register-password" type="password" required minlength="6" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 outline-none" placeholder="至少6位字符"></div>
            <button type="submit" class="w-full bg-brand-600 text-white py-3 rounded-xl font-semibold text-sm hover:bg-brand-700 transition-colors">创建账号</button>
        </form>
        <p class="mt-4 text-center text-sm text-gray-500">已有账号？ <button onclick="switchModal('login')" class="text-brand-600 font-semibold hover:underline">立即登录</button></p>
    </div>
</div>
