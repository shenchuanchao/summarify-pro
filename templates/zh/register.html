{% set title = "免费注册 — Summarify Pro" %}
{% set description = "注册 Summarify Pro 免费账号，享受无限次 AI 文档总结。" %}
{% set canonical = None %}
<!DOCTYPE html>
<html lang="zh-CN">
{% include 'zh/_head.html' %}
<body class="bg-gray-50 text-gray-900 antialiased">
{% include 'zh/_navbar_simple.html' %}

<main class="pt-24 pb-12 px-4">
    <div class="max-w-md mx-auto">
        <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-8">
            <h1 class="text-2xl font-bold text-gray-900 mb-1">创建账号</h1>
            <p class="text-sm text-gray-500 mb-6">注册后即可无限使用</p>
            <form id="register-form-page" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">邮箱</label>
                    <input id="register-email" type="email" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 outline-none" placeholder="you@example.com">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">密码</label>
                    <input id="register-password" type="password" required minlength="6" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 outline-none" placeholder="至少6位字符">
                </div>
                <div id="register-error" class="hidden text-sm text-red-600 bg-red-50 p-3 rounded-lg"></div>
                <button type="submit" class="w-full bg-brand-600 text-white py-3 rounded-xl font-semibold text-sm hover:bg-brand-700 transition-colors shadow-sm">
                    创建账号
                </button>
            </form>
            <p class="mt-6 text-center text-sm text-gray-500">
                已有账号？
                <a href="/zh/login" class="text-brand-600 font-semibold hover:underline">立即登录</a>
            </p>
        </div>
    </div>
</main>

{% include 'zh/_footer.html' %}
<div id="toast" class="hidden fixed bottom-6 right-6 z-[200] bg-gray-900 text-white px-5 py-3 rounded-xl shadow-xl text-sm font-medium animate-fade-in max-w-xs"></div>

<script>
const BASE = 'https://summarify-pro-production.up.railway.app';

let _toastTimer;
function toast(msg, type) {
    type = type || 'info';
    const el = document.getElementById('toast');
    clearTimeout(_toastTimer);
    el.textContent = msg;
    el.className = 'fixed bottom-6 right-6 z-[200] px-5 py-3 rounded-xl shadow-xl text-sm font-medium max-w-xs ' + (type === 'error' ? 'bg-red-600 text-white' : type === 'success' ? 'bg-emerald-600 text-white' : 'bg-gray-900 text-white');
    el.classList.remove('hidden');
    _toastTimer = setTimeout(function() { el.classList.add('hidden'); }, 4000);
}

document.getElementById('register-form-page').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email = document.getElementById('register-email').value.trim();
    const password = document.getElementById('register-password').value.trim();
    const btn = this.querySelector('button[type="submit"]');
    const errorEl = document.getElementById('register-error');
    errorEl.classList.add('hidden');
    btn.disabled = true; btn.textContent = '创建中...';
    try {
        const res = await fetch(BASE + '/api/user/register', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '注册失败');
        localStorage.setItem('summarify_token', data.token);
        localStorage.setItem('summarify_user', JSON.stringify(data.user));
        toast('注册成功，正在跳转...', 'success');
        setTimeout(function() { window.location.href = '/zh/'; }, 800);
    } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
    } finally {
        btn.disabled = false; btn.textContent = '创建账号';
    }
});
</script>
</body>
</html>
